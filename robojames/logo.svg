<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" role="img" aria-label="RoboJames logo">
  <title>RoboJames</title>
  <!-- Background -->
  <rect width="120" height="120" rx="14" ry="14" fill="#ffffff"/>

  <!-- Antenna -->
  <line x1="60" y1="25" x2="60" y2="11" stroke="#2563eb" stroke-width="4" stroke-linecap="round"/>
  <circle cx="60" cy="8" r="5" fill="#2563eb"/>

  <!-- Robot head -->
  <rect x="18" y="25" width="84" height="72" rx="14" ry="14" fill="#2563eb"/>

  <!-- Eyes -->
  <circle cx="42" cy="55" r="8" fill="#ffffff"/>
  <circle cx="78" cy="55" r="8" fill="#ffffff"/>
  <circle cx="42" cy="55" r="3.2" fill="#1e3a8a"/>
  <circle cx="78" cy="55" r="3.2" fill="#1e3a8a"/>

  <!-- Speaker / smile -->
  <rect x="40" y="78" width="40" height="6" rx="3" fill="#ffffff"/>
</svg>
